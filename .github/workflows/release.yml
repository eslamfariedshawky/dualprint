# Builds MultiPrint.exe on Windows.
# - Runs on: a push to main (skipped when only website/, docs/ or *.md files change), a tag starting
#   with v, any pull request, and manual dispatch. Each run builds the app and uploads it as an
#   artifact for testing (read-only permissions).
# - When a tag starting with v is created (e.g. v2.1.2): creates a Release and attaches MultiPrint.zip.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['website/**', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^v?\d+(\.\d+){0,3}$') { $env:REF_NAME } else { '0.0.0' }
          ./build.ps1 -Version $ver
          (Get-FileHash build/MultiPrint.zip -Algorithm SHA256).Hash.ToLower() + '  MultiPrint.zip' | Out-File build/SHA256SUMS.txt -Encoding ascii

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MultiPrint
          path: |
            build/MultiPrint.zip
            build/SHA256SUMS.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MultiPrint
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            MultiPrint.zip
            SHA256SUMS.txt
          generate_release_notes: true
