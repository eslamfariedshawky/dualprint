# Builds DualPrint.exe on Windows.
# - Runs on: a push to main (skipped when only website/, docs/ or *.md files change), a tag starting
#   with v, any pull request, and manual dispatch. Each run builds the app and uploads it as an
#   artifact for testing (read-only permissions).
# - A tag starting with v (e.g. v3.0.0) creates a DualPrint release with DualPrint.zip,
#   the same-byte MultiPrint.zip compatibility alias, and SHA256SUMS.txt for both ZIPs.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['website/**', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^v?\d+(\.\d+){0,3}$') { $env:REF_NAME } else { '0.0.0' }
          ./build.ps1 -Version $ver

      - name: Package release assets
        shell: pwsh
        run: |
          # Keep old latest-download links working; build.ps1 stays canonical-only.
          Copy-Item build/DualPrint.zip build/MultiPrint.zip
          $checksums = foreach ($name in 'DualPrint.zip', 'MultiPrint.zip') {
            (Get-FileHash "build/$name" -Algorithm SHA256).Hash.ToLower() + "  $name"
          }
          $checksums | Out-File build/SHA256SUMS.txt -Encoding ascii

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DualPrint
          path: |
            build/DualPrint.zip
            build/MultiPrint.zip
            build/SHA256SUMS.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DualPrint

      - name: Prepare release metadata
        id: metadata
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          "name=DualPrint $version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes = "docs/release-notes/$($env:REF_NAME).md"
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            "body_path=$notes" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.metadata.outputs.name }}
          body_path: ${{ steps.metadata.outputs.body_path }}
          files: |
            DualPrint.zip
            MultiPrint.zip
            SHA256SUMS.txt
          generate_release_notes: true
