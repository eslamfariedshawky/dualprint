# Publishes the website/ folder to GitHub Pages.
# Enable it once: Settings > Pages > Source: GitHub Actions
# The site URL and repo URL are filled in automatically here, so no file needs editing.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Fill in site and repository links
        run: |
          SITE="${{ steps.pages.outputs.base_url }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          find website -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) \
            -exec sed -i -e "s#__SITE_URL__#${SITE}#g" -e "s#__REPO_URL__#${REPO}#g" {} +
          grep -rl "__SITE_URL__\|__REPO_URL__" website && exit 1 || echo "Links OK: $SITE"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
